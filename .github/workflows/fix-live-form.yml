name: Fix live form
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-live-form.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch today prediction model
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'api/today.ts';
          let s = fs.readFileSync(p, 'utf8');
          const sig = 'function predict(h: S, a: S, base: S | null) {';
          if (s.includes(sig)) s = s.replace(sig, 'function predict(h: S, a: S, base: S | null, liveH: S | null = null, liveA: S | null = null) {\n  if (liveH && liveH.matches >= 3) h = liveH;\n  if (liveA && liveA.matches >= 3) a = liveA;');
          const marker = 'if (lid && (h.matches < 8 || a.matches < 8))';
          const start = s.indexOf(marker);
          const pred = 'const prediction = predict(h, a, base);';
          const end = s.indexOf(pred, start);
          if (start < 0 || end < 0) throw new Error('today prediction markers not found');
          const replacement = `let liveH = empty(), liveA = empty();
          if (lid) {
            const [homeSofaId, awaySofaId] = await Promise.all([f.home.sofaId || resolveSofaTeamId(f.home.name), f.away.sofaId || resolveSofaTeamId(f.away.name)]);
            await Promise.all([
              enrichRecentFromSofa(h, homeSofaId, f.fixtureId),
              enrichRecentFromSofa(a, awaySofaId, f.fixtureId),
              enrichRecentFromSofa(liveH, homeSofaId, f.fixtureId),
              enrichRecentFromSofa(liveA, awaySofaId, f.fixtureId)
            ]);
            const espnSlug = Object.keys(ESPN_LEAGUES).find(k => Number(ESPN_LEAGUES[k]?.[1]) === lid) || '';
            if (liveH.matches < 3 || liveA.matches < 3) await Promise.all([
              liveH.matches < 3 ? enrichRecentFromEspn(liveH, espnSlug, f.home.name, f.fixtureId) : Promise.resolve(false),
              liveA.matches < 3 ? enrichRecentFromEspn(liveA, espnSlug, f.away.name, f.fixtureId) : Promise.resolve(false)
            ]);
          }
          ${pred}`;
          s = s.slice(0, start) + replacement + s.slice(end + pred.length);
          const oldBuild = '  return { league, all, baseline, globalBaseline, byName };';
          const newBuild = `  byName.clear();
          const recentCounts = new Map<string, number>();
          const recent = (snap.fixtures || []).filter((f: any) => f?.goals?.home != null && f?.goals?.away != null).slice().sort((a: any, b: any) => String(b.kickoff || b.date || '').localeCompare(String(a.kickoff || a.date || '')));
          for (const f of recent) {
            const hs = f.stats?.home || {}, as = f.stats?.away || {}, hg = n(f.goals.home), ag = n(f.goals.away);
            const hk = canon(f.home?.name), ak = canon(f.away?.name);
            if (hk && (recentCounts.get(hk) || 0) < 20) { add(byName, hk, hg, ag, true, hs); recentCounts.set(hk, (recentCounts.get(hk) || 0) + 1); }
            if (ak && (recentCounts.get(ak) || 0) < 20) { add(byName, ak, ag, hg, false, as); recentCounts.set(ak, (recentCounts.get(ak) || 0) + 1); }
          }
          return { league, all, baseline, globalBaseline, byName };`;
          if (!s.includes(oldBuild)) throw new Error('build return marker not found');
          s = s.replace(oldBuild, newBuild);
          fs.writeFileSync(p, s);
          NODE
      - name: Validate patch
        run: |
          grep -q 'liveH' api/today.ts
          grep -q 'recentCounts' api/today.ts
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name 'match-probability-ai-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-live-form.yml
          git add api/today.ts
          git commit -m 'fix: use current team form for today predictions'
          git push
