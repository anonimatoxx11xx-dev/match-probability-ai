name: Fix predictor v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-predictor-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch predictor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('api/today.ts')
          s=p.read_text()
          old="""  const hw = h.matches ? h.hm / (h.matches + 8) : .5, aw = a.matches ? a.am / (a.matches + 8) : .5;
  const hgf = h.hm ? h.hgf / h.hm : 1.35, hga = h.hm ? h.hga / h.hm : 1.35, agf = a.am ? a.agf / a.am : 1.15, aga = a.am ? a.aga / a.am : 1.15;
  const lh = clamp(((hgf * .55 + (h.matches ? h.gf / h.matches : 1.35) * .45) * hw + (aga * .45 + (a.matches ? a.ga / a.matches : 1.15) * .55) * aw) * 1.05, .2, 3.8);
  const la = clamp(((agf * .55 + (a.matches ? a.gf / a.matches : 1.15) * .45) * aw + (hga * .45 + (h.matches ? h.ga / h.matches : 1.35) * .55) * hw) * .95, .15, 3.5);"""
          new="""  const hOverallGF = h.matches > 0 ? h.gf / h.matches : 1.45;
  const hOverallGA = h.matches > 0 ? h.ga / h.matches : 1.20;
  const aOverallGF = a.matches > 0 ? a.gf / a.matches : 1.15;
  const aOverallGA = a.matches > 0 ? a.ga / a.matches : 1.45;
  const hAttack = h.hm > 0 ? h.hgf / h.hm : hOverallGF;
  const hDefense = h.hm > 0 ? h.hga / h.hm : hOverallGA;
  const aAttack = a.am > 0 ? a.agf / a.am : aOverallGF;
  const aDefense = a.am > 0 ? a.aga / a.am : aOverallGA;
  const hSample = clamp(h.matches / 10, 0, 1), aSample = clamp(a.matches / 10, 0, 1);
  const homePrior = 1.50, awayPrior = 1.15;
  const lhRaw = (hAttack * .50 + aDefense * .30 + hOverallGF * .20) * .92 + homePrior * .08;
  const laRaw = (aAttack * .50 + hDefense * .30 + aOverallGF * .20) * .92 + awayPrior * .08;
  const lh = clamp(lhRaw * (.75 + .25 * hSample), .35, 3.8);
  const la = clamp(laRaw * (.75 + .25 * aSample), .30, 3.5);"""
          if old not in s:
              raise SystemExit('predictor formula marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          grep -q 'hOverallGF' api/today.ts
          grep -q 'homePrior' api/today.ts
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'match-probability-ai-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-predictor-v2.yml
          git add api/today.ts
          git commit -m 'fix: stabilize current form predictor'
          git push
