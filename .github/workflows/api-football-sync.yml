name: API-Football Data Sync

on:
  push:
    paths:
      - '.github/workflows/api-football-sync.yml'
      - 'scripts/api-football-sync.mjs'
  workflow_dispatch:
    inputs:
      season:
        description: 'Stagione API-Football singola (fallback/manuale)'
        required: true
        default: '2026'
        type: string
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: api-football-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      REQUEST_DELAY_MS: '6500'
      MAX_DETAIL_FIXTURES: '40'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check secret
        run: |
          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "API_FOOTBALL_KEY non configurata nei Secrets del repository"
            exit 1
          fi

      - name: Collect current and historical season data
        run: |
          SEASON=2026 node scripts/api-football-sync.mjs > /tmp/current.json
          TODAY_TEAM_IDS=$(node -e "const x=require('/tmp/current.json'); process.stdout.write((x.todayTeamIds||[]).join(','))")
          echo "Squadre di oggi: ${TODAY_TEAM_IDS:-nessuna}"
          TODAY_TEAM_IDS="$TODAY_TEAM_IDS" SEASON=2024 node scripts/api-football-sync.mjs > /tmp/historical.json
          node <<'NODE'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('/tmp/current.json','utf8'));
          const b = JSON.parse(fs.readFileSync('/tmp/historical.json','utf8'));
          const teams = new Map();
          for (const t of [...(b.teams||[]), ...(a.teams||[])]) teams.set(String(t.apiId), t);
          const fixtures = [...(b.fixtures||[]), ...(a.fixtures||[])];
          const byId = new Map();
          for (const f of fixtures) byId.set(String(f.fixtureId), f);
          const out = {
            generatedAt: new Date().toISOString(),
            seasons: [2026, 2024],
            mode: 'historical-bootstrap-current-plus-accessible-history-priority-today',
            today: a.today || null,
            todayTeamIds: a.todayTeamIds || [],
            leagues: a.leagues || b.leagues || [],
            teams: [...teams.values()],
            fixtures: [...byId.values()].sort((x,y)=>String(x.kickoff).localeCompare(String(y.kickoff)))
          };
          fs.writeFileSync('data/api-football/latest.json', JSON.stringify(out, null, 2));
          console.log(`seasons=${out.seasons.join(',')} fixtures=${out.fixtures.length} teams=${out.teams.length} todayTeams=${out.todayTeamIds.length}`);
          NODE

      - name: Validate snapshot
        run: |
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('data/api-football/latest.json','utf8')); if(!x.generatedAt || !Array.isArray(x.fixtures) || !Array.isArray(x.teams)) process.exit(1); console.log('fixtures='+x.fixtures.length,'teams='+x.teams.length,'generatedAt='+x.generatedAt);"

      - name: Commit snapshot
        run: |
          git config user.name 'match-probability-ai-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/api-football/latest.json
          if git diff --cached --quiet; then
            echo 'Nessun cambiamento dati.'
            exit 0
          fi
          git commit -m "chore: refresh current and historical API-Football stats"
          git push
