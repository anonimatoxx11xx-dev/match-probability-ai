name: Finalize live form
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-live-form.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Pass live form to predictor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('api/today.ts')
          s=p.read_text()
          old='const prediction = predict(h, a, base);'
          new='const prediction = predict(h, a, base, liveH, liveA);'
          if old not in s:
              raise SystemExit('prediction call marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          grep -q 'predict(h, a, base, liveH, liveA)' api/today.ts
      - name: Commit and remove workflow
        run: |
          git config user.name 'match-probability-ai-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/finalize-live-form.yml
          git add api/today.ts
          git commit -m 'fix: pass live form into prediction'
          git push
