name: Build Match Probability AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-match-probability-apk.yml'

permissions:
  contents: read

env:
  JAVA_VERSION: '21'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm install

      - name: Build web bundle
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build release APK
        run: ./android/gradlew -p android assembleRelease --no-daemon

      - name: Verify and stage APK
        run: |
          set -euo pipefail
          echo "Searching APK under: $GITHUB_WORKSPACE/app/android"
          find "$GITHUB_WORKSPACE/app/android" -type f -name '*.apk' -print
          APK="$(find "$GITHUB_WORKSPACE/app/android" -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "ERROR: no APK was produced"
            find "$GITHUB_WORKSPACE/app/android/app/build/outputs" -maxdepth 8 -type f -print || true
            exit 1
          fi
          echo "APK produced: $APK"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$APK" "$GITHUB_WORKSPACE/artifacts/Match-Probability-AI.apk"
          test -s "$GITHUB_WORKSPACE/artifacts/Match-Probability-AI.apk"
          ls -lh "$GITHUB_WORKSPACE/artifacts/Match-Probability-AI.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Match-Probability-AI-APK-NATIVE-HTTP
          path: artifacts/Match-Probability-AI.apk
          if-no-files-found: error
          retention-days: 30
