name: Build Match Probability AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-match-probability-apk.yml'
  workflow_run:
    workflows: ["Verify Match Probability AI"]
    types: [completed]

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  BUILD_TOOLS_VERSION: '35.0.0'

jobs:
  build-apk:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package.json
      - name: Install Android build tools
        working-directory: .
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;${BUILD_TOOLS_VERSION}"
      - name: Install npm dependencies
        run: npm install --no-audit --no-fund --prefer-online
      - name: Select Build100 UI entrypoint
        run: |
          set -euo pipefail
          test -f src/main-ui-build100.js
          sed -i "s#src/main-ui-build[0-9]*.js#src/main-ui-build100.js#" index.html
          grep -q "main-ui-build100.js" index.html
      - name: Fix legacy Build79 header template
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main-ui-build79.js'); s=p.read_text()
          old='</div></div>${body}<nav>'; new='</div></header>${body}<nav>'
          count=s.count(old)
          assert count==1, f'expected exactly one malformed header template, found {count}'
          p.write_text(s.replace(old,new,1))
          PY
      - name: Add real home/away forecast payload to match cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main-ui-build79.js'); s=p.read_text()
          old="if(!verified(t))return '';const p=probs(t),fav=state.favorites.has(String(t.id));return `<article class=\"match-card\">"
          new="if(!verified(t))return '';const p=probs(t),fav=state.favorites.has(String(t.id));const b98Payload=side=>JSON.stringify(Object.fromEntries(STAT.slice(0,6).map(x=>[x[0],forecast(t,x[0],side)])));return `<article class=\"match-card\" data-b98-home='${esc(b98Payload('home'))}' data-b98-away='${esc(b98Payload('away'))}'>"
          if old not in s: raise SystemExit('matchCard insertion point not found')
          p.write_text(s.replace(old,new,1))
          PY
          grep -q 'data-b98-home' src/main-ui-build79.js
          grep -q 'data-b98-away' src/main-ui-build79.js
      - name: Build web bundle
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Make Gradle executable
        run: chmod +x android/gradlew
      - name: Build debug APK
        run: ./android/gradlew -p android assembleDebug --no-daemon
      - name: Zipalign and re-sign APK with APK Signature Scheme v2+
        working-directory: .
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}"
          INPUT="$GITHUB_WORKSPACE/app/android/app/build/outputs/apk/debug/app-debug.apk"
          ALIGNED="$GITHUB_WORKSPACE/app/android/app/build/outputs/apk/debug/app-debug-aligned.apk"
          FINAL="$GITHUB_WORKSPACE/artifacts/Match-Probability-AI.apk"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          test -x "$TOOLS/zipalign"; test -x "$TOOLS/apksigner"; test -f "$INPUT"
          "$TOOLS/zipalign" -P 16 -f 4 "$INPUT" "$ALIGNED"
          "$TOOLS/zipalign" -c -P 16 -v 4 "$ALIGNED"
          DEBUG_KEYSTORE="$HOME/.android/debug.keystore"; mkdir -p "$HOME/.android"
          if [ ! -f "$DEBUG_KEYSTORE" ]; then
            keytool -genkeypair -v -keystore "$DEBUG_KEYSTORE" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          fi
          "$TOOLS/apksigner" sign --ks "$DEBUG_KEYSTORE" --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --min-sdk-version 23 --max-sdk-version 35 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled false --out "$FINAL" "$ALIGNED"
          "$TOOLS/apksigner" verify --verbose --print-certs "$FINAL"
          "$TOOLS/zipalign" -c -P 16 -v 4 "$FINAL"
          unzip -t "$FINAL"
          python3 - <<'PY'
          import struct,zipfile
          apk='artifacts/Match-Probability-AI.apk'
          with zipfile.ZipFile(apk) as z:
              info=z.getinfo('resources.arsc')
              assert info.compress_type==zipfile.ZIP_STORED
              with open(apk,'rb') as f:
                  f.seek(info.header_offset); local=f.read(30)
                  sig,=struct.unpack_from('<I',local,0); assert sig==0x04034B50
                  name_len,extra_len=struct.unpack_from('<HH',local,26)
                  data_offset=info.header_offset+30+name_len+extra_len
                  assert data_offset%4==0
                  print('resources.arsc aligned:',data_offset)
          PY
          test -s "$FINAL"
          unzip -p "$FINAL" assets/public/assets/index-*.js | grep -q 'BUILD 100'
          unzip -p "$FINAL" assets/public/assets/index-*.js | grep -q 'data-b98-home'
          unzip -p "$FINAL" assets/public/assets/index-*.js | grep -q 'data-b98-away'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Match-Probability-AI-BUILD100-SPORT
          path: artifacts/Match-Probability-AI.apk
          if-no-files-found: error
          retention-days: 30
