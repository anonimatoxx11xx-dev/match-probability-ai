name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/build-android-app.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Normalize interactive selection runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/main.js')
          s=p.read_text()
          s=s.replace("function choiceFor(t,index){const id=t.id||index,c=state.choice[id]||{};return{market:c.market||'shotsOnTarget',mode:c.mode||state.mode[id]||'total'}}", "function choiceFor(t,index){const c=state.choice[index]||{};return{market:c.market||'shotsOnTarget',mode:c.mode||state.mode[index]||'total'}}")
          p.write_text(s)
          q=Path('src/main-ui-fast.js')
          if q.exists():
              x=q.read_text()
              x=x.replace("import { todayMatches, findTeamIds, enrichHistory, diagnostics, clearProviderCache } from './provider-engine.js';", "import { todayMatches } from './schedule-engine.js';\nimport { findTeamIds, enrichHistory, diagnostics, clearProviderCache } from './provider-engine.js';")
              x=x.replace('BUILD 66','BUILD 67')
              bad=r"sources=\[\.\.\.new Set\(\[\.\.\.\(c\.side==='home'\?h:c\.side==='away'\?a:\[\.\.\.h,\.\.\.a\]\)\.flatMap\(x=>x\.sources\|\|\[\]\)\)\]\];"
              good="sources=[...new Set((c.side==='home'?h:c.side==='away'?a:[...h,...a]).flatMap(x=>x.sources||[]))];"
              x,n=re.subn(bad,good,x)
              if n==0:
                  x=x.replace("sources=[...new Set([...(c.side==='home'?h:c.side==='away'?a:[...h,...a]).flatMap(x=>x.sources||[]))]];",good)
              q.write_text(x)
              print('main-ui-fast.js replacements:',n)
          PY
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: match-probability-ai-debug
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
