name = "match-probability-ai"
main = "src/worker-v2.ts"
compatibility_date = "2026-09-03"

[triggers]
# Historical snapshot sync + daily prediction cache warm-up.
# Live fixtures are fetched from ESPN/API-Football by /api/today.
crons = ["0 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "match-probability-ai-db"
database_id = "6da97357-a6cc-471b-86e7-21db19e67d98"

# Daily predictions are calculated once and served from KV afterwards.
# Wrangler automatically provisions this namespace on deploy.
[[kv_namespaces]]
binding = "PREDICTIONS_KV"
